# ===========================================================================
# ymai.fun — World Space V0 入口层
# 发布候选: YuemingHub/World-Space @ 85c7b91e5252845c541cca211ef48f8748f63ced (branch v2)
#
#   /  /style.css  /app.js  /render.mjs   -> 127.0.0.1:3200  (Node 同源托管 web/v2 静态页)
#   /api/world                            -> 同一个 Node
#   /healthz                              -> 同一个 Node
#   前端与接口同源：不拆 Pages、不拆域名。
#
#   上游是单实例 Node（只监听 127.0.0.1:3200，不开 worker、不做 cluster、不负载均衡）。
#   proxy_read_timeout 180s：必须大于上游最坏耗时。Node 单条 LLM 调用 90s
#   （WS_TIMEOUT_MS=90000）且每阶段允许一次重试，整请求可超过 120s —— 实测 2026-09-14
#   20:07 一条请求 Node 用了 123.5s，nginx 120s 抢先 504，用户看到网关页而不是产品的
#   诚实失败页。与 ymai.love 块同一理由（read timeout 必须大于上游超时）。
#   X-Forwarded-For 用 $proxy_add_x_forwarded_for：Node 侧 WS_TRUST_PROXY=1 +
#   WS_TRUSTED_PROXIES=127.0.0.1，取最右一个合法 IP，公网伪造的头被顶掉。
#
#   证书：certbot certonly --nginx -d ymai.fun（只验证不安装），443 块手写，
#   与 ymai.love 同套路；有效至 2026-12-13，续期由 certbot timer 负责。
#   本文件只管 ymai.fun。ymai.me / ymai.love / mingos.cn 各自的块不碰。
#
#   回滚（入口层，DNS 回旧值即可回到 GitHub Pages 旧站）:
#     rm -f /etc/nginx/sites-enabled/world-space && nginx -t && systemctl reload nginx
#     systemctl stop world-space.service
#     前一版本备份见同目录 .bak-*
# ===========================================================================

upstream world_space_node {
    server 127.0.0.1:3200 max_fails=0;
    keepalive 8;
}

# ---------- 80：仅跳转（ACME 挑战 location 由 certbot 临时注入，不预置） ----------
server {
    listen 80;
    listen [::]:80;
    server_name ymai.fun;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：World Space V0 正式入口 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ymai.fun;

    ssl_certificate     /etc/letsencrypt/live/ymai.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymai.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 请求体上限交给应用自己判（server/world.mjs 超 20KB 拒绝并给诚实文案），
    # 这里只挡掉明显超量的噪声，不给 nginx 抢先返回难懂的 413 页。
    client_max_body_size 64k;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://world_space_node;
    }
}
