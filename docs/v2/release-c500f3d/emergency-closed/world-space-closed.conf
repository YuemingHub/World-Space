## World Space — EMERGENCY CLOSED STATE（fail-closed，切流前必须先装好并 nginx -t 通过）
##
## 语义：认证版本出问题 → 宁可关站，不能回到无访问门的公开版本。
## 本块 **不代理任何 upstream**：Node 挂了 / 认证坏了 / 上游被打穿，都不会从这里漏出内容，
## 也不会把请求转给 85c7b91 之类的旧公开版本或 GitHub Pages 公开站。
##
## 安装位置：/etc/nginx/sites-available/world-space-closed
## 启用/停用只用 emergency-close.sh / emergency-restore.sh 切换 sites-enabled 里的符号链接。
## 本文件与正常块互斥：两者同时 enabled 时 world-space（字母序在前）会赢，等于没关站。

server {
    listen 80;
    listen [::]:80;
    server_name ymai.fun www.ymai.fun;

    root /opt/world-space/emergency/www;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 任何路径（含 /api/*、/login、/healthz）一律 503，只回维护页。
    location / {
        return 503;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }

    access_log /var/log/nginx/world-space-closed.access.log;
    error_log  /var/log/nginx/world-space-closed.error.log warn;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ymai.fun www.ymai.fun;

    # 证书沿用正常块的同一份（切流前必须与 nginx -T 里的实际路径逐项核对）。
    ssl_certificate     /etc/letsencrypt/live/ymai.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymai.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/world-space/emergency/www;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 503;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }

    access_log /var/log/nginx/world-space-closed.access.log;
    error_log  /var/log/nginx/world-space-closed.error.log warn;
}
