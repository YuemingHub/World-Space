worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 64; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Same upstream shape as /etc/nginx/sites-available/world-space:28-31
    upstream world_space_node {
        server ai-stub:3200 max_fails=0;
        keepalive 8;
    }

    # Ports/TLS differ from production (8080 vs 443); everything else is the
    # production 443 block verbatim except proxy_pass target and static roots.
    server {
        listen 8080;
        server_name ymai.fun;

        client_max_body_size 64k;

        include /etc/nginx/snippets/ming-portfolio.conf;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_pass http://world_space_node;
        }
    }
}
