# Production snippet verbatim (read 2026-11-01 via ssh, /etc/nginx/snippets/ming-portfolio.conf),
# with only the static root path changed to the harness mount (/srv/static).

# /ming 规范化到 /ming/，避免目录列表与相对链接歧义
location = /ming {
    return 301 /ming/;
}

location /ming/ {
    root  /srv/static;
    index index.html;
    try_files $uri $uri/index.html $uri/ =404;
    # 静态作品集不参与应用的登录判定，也不继承应用的 no-store
    add_header Cache-Control "public, max-age=300";
}

# --- /ai/ (World Space AI beginner entry) — 2026-11-01 ---
location = /ai { return 301 /ai/; }
location ^~ /ai/ {
    root /srv/static;
    index index.html;
    try_files $uri $uri/index.html $uri/ =404;
    add_header Cache-Control "public, max-age=300";
}
